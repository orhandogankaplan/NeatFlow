[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidydownloads"
version = "1.0.0"
description = "Akıllı İndirilenler klasörü düzenleyicisi ve bildirimli otomatik temizleyici"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TidyDownloads" }]
dependencies = [
    "watchdog>=4.0.0",
    "PyYAML>=6.0.1",
    "send2trash>=1.8.3",
    "plyer>=2.1.0",
]

[project.scripts]
tidydownloads = "tidydownloads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
